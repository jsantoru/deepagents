services:
  backend:
    build:
      context: ./backend
    container_name: cortex-backend
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      DATABASE_URL: sqlite+aiosqlite:////data/cortex.db
      AGENT_MODEL: ${AGENT_MODEL:-openai:gpt-5-nano}
    volumes:
      - cortex-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: cortex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"

volumes:
  cortex-data:
