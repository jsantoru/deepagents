services:
  postgres:
    image: postgres:16
    container_name: deepagents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deepagents
      POSTGRES_USER: deepagents
      POSTGRES_PASSWORD: deepagents
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
