[project]
name = "cortex-backend"
version = "0.1.0"
description = "Cortex: a deep-research agent with graph-based long-term memory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "deepagents>=0.6.1",
  "fastapi>=0.115.12",
  "langchain>=0.3.25",
  "langchain-openai>=0.3.18",
  "pydantic-settings>=2.9.1",
  "sqlalchemy>=2.0.41",
  "tavily-python>=0.7.2",
  "uvicorn[standard]>=0.34.2",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]  # FastAPI Depends idiom; stream errors surfaced as SSE events
